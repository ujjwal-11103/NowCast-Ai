server {
    listen 3000;
    server_name 20.235.178.245;

    root /home/azureuser/NowCast-Ai/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy for /api with referer-based routing
    location /api {
        set $target_url "https://nowcast.intellimark.ai";
        if ($http_referer ~* "tp-optimisation") {
            set $target_url "http://52.172.42.245:5005";
        }
        proxy_pass $target_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Rewrite if needed (vite config says rewrite: (path) => path.replace(/^\/api/, '/api'), which is no-op)
    }

    location /explorer/ {
        proxy_pass https://nowcast.intellimark.ai/;
        proxy_set_header Host nowcast.intellimark.ai;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /data-api {
        proxy_pass https://nowcast.intellimark.ai;
        proxy_set_header Host nowcast.intellimark.ai;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /alfred/ {
        proxy_pass http://20.235.178.245:8085/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /neptune {
        proxy_pass http://20.235.178.245:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /tp-optimisation {
        proxy_pass http://52.172.42.245:5005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Remove X-Frame-Options as per vite config
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "" always;
    }

    location /static {
        proxy_pass http://52.172.42.245:5005;
    }

    location /manifest.json {
        proxy_pass http://52.172.42.245:5005;
    }

    location /favicon.ico {
        proxy_pass http://52.172.42.245:5005;
    }

    location /logo192.png {
        proxy_pass http://52.172.42.245:5005;
    }
}
